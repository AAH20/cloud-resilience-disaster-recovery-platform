[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continuitytwin"
version = "0.1.0"
description = "Cloud disaster recovery, business continuity, RTO/RPO and chaos engineering evidence compiler"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ahmed Hassan"}]

[project.optional-dependencies]
test = ["pytest>=8.4,<9"]

[project.scripts]
continuitytwin = "continuitytwin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
