name: Cloud resilience and disaster recovery CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  recovery-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: continuitytwin examples/revenue-platform/game-day.json --output generated/revenue-platform
      - run: git diff --exit-code generated/revenue-platform
      - run: python -m compileall -q src tests
      - uses: azure/cli@v2
        with:
          inlineScript: az bicep build --file infra/azure/main.bicep --outfile /tmp/main.json
